# A single free web service; PostgreSQL is provisioned separately in Neon Free.
services:
  - type: web
    name: wj-quant-api
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/owagnerjrr/investwag
    branch: main
    rootDir: server
    buildCommand: npm ci --no-audit --no-fund && npm run build
    # Free has no pre-deploy job/shell. Idempotent migrations run before startup.
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
